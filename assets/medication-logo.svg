<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Medication App logo</title>
  <desc id="desc">A capsule crossed by a rising check mark on a dark teal circle.</desc>
  <defs>
    <linearGradient id="disc" x1="42" y1="28" x2="213" y2="225" gradientUnits="userSpaceOnUse">
      <stop stop-color="#176F76"/>
      <stop offset=".58" stop-color="#0E4558"/>
      <stop offset="1" stop-color="#082B3D"/>
    </linearGradient>
    <linearGradient id="capsuleBlue" x1="92" y1="42" x2="153" y2="127" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2398AE"/>
      <stop offset="1" stop-color="#07527E"/>
    </linearGradient>
    <linearGradient id="capsuleWhite" x1="103" y1="130" x2="163" y2="211" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9F5EE"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#031B28" flood-opacity=".55"/>
    </filter>
    <clipPath id="capsuleClip">
      <rect x="91" y="39" width="74" height="178" rx="37"/>
    </clipPath>
  </defs>

  <circle cx="128" cy="128" r="119" fill="url(#disc)"/>
  <circle cx="128" cy="128" r="118" fill="none" stroke="#245F68" stroke-width="2"/>

  <g fill="#D9ECEB" opacity=".86">
    <circle cx="113" cy="42" r="5"/>
    <circle cx="128" cy="42" r="5"/>
    <circle cx="143" cy="42" r="5"/>
  </g>
  <path d="M45 121h21M55.5 110.5v21" stroke="#D9ECEB" stroke-width="8" stroke-linecap="round" opacity=".86"/>
  <path d="M128 218c-7-10-20-5-20 5 0 8 11 15 20 22 9-7 20-14 20-22 0-10-13-15-20-5Z" fill="#D9ECEB" opacity=".86"/>

  <g transform="rotate(-42 128 128)" filter="url(#shadow)">
    <g clip-path="url(#capsuleClip)">
      <rect x="91" y="39" width="74" height="90" fill="url(#capsuleBlue)"/>
      <rect x="91" y="129" width="74" height="88" fill="url(#capsuleWhite)"/>
      <rect x="91" y="121" width="74" height="16" fill="#6BC9A2" opacity=".62"/>
    </g>
    <rect x="91" y="39" width="74" height="178" rx="37" fill="none" stroke="#85DDB3" stroke-width="7"/>
    <path d="M111 59c12-8 28-7 39 1" fill="none" stroke="#F1FFFD" stroke-width="9" stroke-linecap="round" opacity=".92"/>
    <path d="M145 75v29" fill="none" stroke="#E8FAF8" stroke-width="8" stroke-linecap="round" opacity=".9"/>
  </g>

  <path d="M61 151 105 193 190 79" fill="none" stroke="#071F2B" stroke-width="31" stroke-linecap="round" stroke-linejoin="round" opacity=".55"/>
  <path d="M61 143 105 185 190 71" fill="none" stroke="#F8FFFE" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m178 65 31-12-7 32Z" fill="#F8FFFE"/>
  <path d="M67 145 105 181" fill="none" stroke="#E2F8F4" stroke-width="7" stroke-linecap="round" opacity=".9"/>
</svg>
